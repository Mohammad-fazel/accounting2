name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build APK
        run: |
          set -e
          if [ -f accounting-apk-project.zip ]; then unzip -q accounting-apk-project.zip; fi
          if [ -d accounting-apk ]; then cd accounting-apk; fi
          npm install
          npx cap add android
          node setup-android.js
          npx @capacitor/assets generate --android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: accounting-apk
          path: "**/outputs/apk/debug/app-debug.apk"
          
